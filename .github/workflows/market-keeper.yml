name: Dibs market keeper

on:
  # QStash owns the production five-minute schedule. Keep this workflow as an
  # operator-controlled recovery path and for evidence capture only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dibs-market-keeper
  cancel-in-progress: false

jobs:
  maintain-and-open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance lifecycle and open eligible markets
        env:
          DIBS_CRON_SECRET: ${{ secrets.DIBS_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${DIBS_CRON_SECRET}" \
            https://dibs-metropolis.vercel.app/api/markets/open
      - name: Verify Envio and oracle queue health
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            https://dibs-metropolis.vercel.app/api/health
