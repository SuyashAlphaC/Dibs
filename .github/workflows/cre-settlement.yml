name: Dibs CRE settlement keeper

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dibs-cre-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ vars.CRE_SETTLEMENT_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.CRE_RECEIVER_OWNER_PRIVATE_KEY }}
      CRE_RECEIVER_OWNER_PRIVATE_KEY: ${{ secrets.CRE_RECEIVER_OWNER_PRIVATE_KEY }}
      CRE_ETH_PRIVATE_KEY: ${{ secrets.CRE_RECEIVER_OWNER_PRIVATE_KEY }}
      CRE_API_KEY: ${{ secrets.CRE_API_KEY }}
      NEXT_PUBLIC_DIBS_CONTRACT_ADDRESS: ${{ vars.DIBS_CONTRACT_ADDRESS }}
      CRE_SETTLEMENT_RECEIVER_ADDRESS: ${{ vars.CRE_SETTLEMENT_RECEIVER_ADDRESS }}
      CRE_SIMULATION_RECEIVER_ADDRESS: ${{ vars.CRE_SIMULATION_RECEIVER_ADDRESS }}
      CRE_MOCK_FORWARDER_ADDRESS: ${{ vars.CRE_MOCK_FORWARDER_ADDRESS }}
      DIBS_ENV_FILE: .env.github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Validate required secrets
        run: |
          test -n "${MONAD_RPC_URL}" || { echo "Missing MONAD_RPC_URL secret"; exit 1; }
          test -n "${CRE_RECEIVER_OWNER_PRIVATE_KEY}" || { echo "Missing CRE_RECEIVER_OWNER_PRIVATE_KEY secret"; exit 1; }
          test -n "${CRE_API_KEY}" || { echo "Missing CRE_API_KEY secret"; exit 1; }
      - name: Install dependencies
        run: npm ci && (cd oracle && npm ci)
      - name: Install verified CRE CLI
        run: |
          curl -sSL https://app.chain.link/cre/install.sh | bash
          echo "${HOME}/.cre" >> "${GITHUB_PATH}"
          echo "${HOME}/.cre/bin" >> "${GITHUB_PATH}"
      - name: Settle ready markets
        run: |
          touch .env.github-actions
          npm run cre:broadcast
      - name: Verify system health
        run: curl --fail-with-body --silent --show-error https://dibs-metropolis.vercel.app/api/health
