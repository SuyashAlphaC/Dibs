name: Dibs CRE DON monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dibs-cre-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ vars.CRE_SETTLEMENT_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRE_API_KEY: ${{ secrets.CRE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install verified CRE CLI
        run: |
          curl -sSL https://app.chain.link/cre/install.sh | bash
          echo "${HOME}/.cre" >> "${GITHUB_PATH}"
          echo "${HOME}/.cre/bin" >> "${GITHUB_PATH}"
      - name: Verify active DON workflow
        run: |
          test -n "${CRE_API_KEY}" || { echo "Missing CRE_API_KEY secret"; exit 1; }
          cd oracle
          cre workflow get . --target staging-settings --json | tee ../cre-don-status.json
          jq -e '.workflow.status == "ACTIVE" and .workflow.workflowId != null' ../cre-don-status.json >/dev/null
      - name: Verify system health
        run: curl --fail-with-body --silent --show-error https://dibs-metropolis.vercel.app/api/health
