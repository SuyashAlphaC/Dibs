name: Dibs CRE DON monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dibs-cre-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ vars.CRE_SETTLEMENT_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CRE_API_KEY: ${{ secrets.CRE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install verified CRE CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 https://app.chain.link/cre/install.sh | bash
          echo "${HOME}/.cre" >> "${GITHUB_PATH}"
          echo "${HOME}/.cre/bin" >> "${GITHUB_PATH}"
      - name: Test monitor failure handling
        run: node --test scripts/collect-cre-status.test.mjs scripts/verify-cre-health.test.mjs
      - name: Collect fresh CRE monitoring data with bounded retries
        run: |
          test -n "${CRE_API_KEY}" || { echo "Missing CRE_API_KEY secret"; exit 1; }
          node scripts/collect-cre-status.mjs
      - name: Verify active DON workflow and recent successful execution
        run: node scripts/verify-cre-health.mjs cre-don-status.json cre-don-executions.json
      - name: Verify system health
        run: |
          curl --fail-with-body --silent --show-error https://dibs-metropolis.vercel.app/api/health > system-health.json
          jq -e --arg workflow "$(jq -r '.workflow.workflowId' cre-don-status.json)" '
            .ok == true and .services.creReceiver.workflowPinned == true and
            (.services.creReceiver.workflowId | ltrimstr("0x")) == ($workflow | ltrimstr("0x"))
          ' system-health.json >/dev/null
      - name: Retain DON execution evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cre-don-health
          path: |
            cre-don-status.json
            cre-don-executions.json
            system-health.json
          if-no-files-found: ignore
